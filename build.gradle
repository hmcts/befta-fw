plugins {
    id 'java-library'
    id 'maven-publish'
    id 'io.github.ben-manes.versions' version '0.67.0'
}

apply plugin: 'java'

tasks.named('dependencyUpdates') {
    rejectVersionIf {
        candidate.version =~ /(?i)[.\-](?:(?:alpha|beta|milestone|rc)(?:[.\-]?\d+)?|m\d+)(?:$|[.\-+])/
    }
}

def buildNumber = System.getenv("RELEASE_VERSION")?.replace("refs/tags/", "") ?: "10.0.0"
System.out.println("version = " + buildNumber)

group = 'com.github.hmcts'

version = buildNumber

def gitRepo = "https://github.com/hmcts/befta-fw"

def pomConfig = {
    licenses {
        license {
            name "MIT License"
            url "http://www.opensource.org/licenses/mit-license.php"
            distribution "repo"
        }
    }

    scm {
        url "https://github.com/hmcts/befta-fw"
    }
}

// tag::repositories[]
repositories {
    mavenLocal()
    mavenCentral()
    maven {
        url = 'https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1'
    }
}
// end::repositories[]

base {
    archivesName = "befta-fw"
}

task sourcesJar(type: Jar, dependsOn: classes) {
    archiveClassifier = 'sources'
    from sourceSets.main.allSource
}

task javadocJar(type: Jar, dependsOn: javadoc) {
    archiveClassifier = 'javadoc'
    from javadoc.destinationDir
}
tasks.withType(Test) {
  useJUnitPlatform()

  testLogging {
    exceptionFormat = 'full'
  }
}

test {
  failFast = false
  testLogging.showStandardStreams = true
  jvmArgs = [
    "--add-opens=java.base/java.lang.reflect=ALL-UNNAMED",
    "--add-opens=java.base/java.lang=ALL-UNNAMED",
    "--add-opens=java.base/java.util=ALL-UNNAMED"
  ]
}

task definitionsToJson(dependsOn: sourcesJar) {
    group = "Execution"
    description = "Runs DefinitionConverter for Excel to JSON"

    doFirst() {
        fileTree("${project.projectDir}/src/main/resources/uk/gov/hmcts/befta/dse/ccd/definitions/excel").matching {
            include "*.xlsx"
            exclude "~*.xlsx"
        }.visit { FileVisitDetails details ->
            def name = details.getName()
            def inputPath = "${project.projectDir}/src/main/resources/uk/gov/hmcts/befta/dse/ccd/definitions/excel/${name}"
            def outputFolderPath = "${project.projectDir}/src/main/resources/uk/gov/hmcts/befta/dse/ccd/definitions/valid/"
            def useJurisdictionName = false;

            // overrides for BEFTA Master
            if (name == 'BEFTA_Master_Definition.xlsx') {
                useJurisdictionName = true;
            }

            logger.quiet("\nConverting ${name} to JSON.\n")

            javaexec {
                classpath = sourceSets.main.runtimeClasspath
                main = definitionConverterMain
                args = [
                    "to-json",
                    inputPath,
                    outputFolderPath,
                    useJurisdictionName
                ]
            }
        }
    }

    outputs.upToDateWhen { false }
}

publishing {
    publications {
        Main(MavenPublication) {
            from components.java
            artifact sourcesJar
            artifact javadocJar
            groupId = project.group
            artifactId = 'befta-fw'
            version = project.version

            pom.withXml {
                def root = asNode()
                root.appendNode('description', 'Backend Functional Test Automation Framework')
                root.appendNode('name', 'BEFTA FW')
                root.appendNode('url', gitRepo)
                root.children().last() + pomConfig
            }
        }
    }
    repositories {
        maven {
            name = "AzureArtifacts"
            url = uri("https://pkgs.dev.azure.com/hmcts/Artifacts/_packaging/hmcts-lib/maven/v1")
            credentials {
                username = System.getenv("AZURE_DEVOPS_ARTIFACT_USERNAME")
                password = System.getenv("AZURE_DEVOPS_ARTIFACT_TOKEN")
            }
        }
    }
}

wrapper.gradleVersion = '9.9.1'

ext {
    junitJupiterVersion = '6.1.3'
    cucumberVersion = '8.1.0'
    lombokVersion = '1.18.48'
    definitionConverterMain = "uk.gov.hmcts.befta.dse.ccd.DefinitionConverter"
}

dependencies {
    implementation platform('org.springframework.boot:spring-boot-dependencies:4.2.0')
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.5')

    implementation "com.github.rholder:guava-retrying:2.0.0"
    implementation "com.github.hmcts:service-auth-provider-java-client:6.1.2"
    implementation "com.google.guava:guava:33.8.0-jre"
    implementation "com.launchdarkly:launchdarkly-java-server-sdk:7.18.1"
    implementation "io.cucumber:cucumber-java:${cucumberVersion}"
    implementation "io.cucumber:cucumber-junit:${cucumberVersion}"
    implementation "io.github.openfeign:feign-jackson3:13.18"
    implementation "io.rest-assured:rest-assured:6.3.0"
    implementation "org.apache.commons:commons-lang3:3.22.0"
    implementation "org.apache.httpcomponents:httpcore:4.4.16"
    // Purposefully capping the version of org.apache.poi:poi-ooxml to 4.1.2 to avoid issue
    // NoSuchMethodError: org.apache.commons.io.IOUtils.byteArray() from commons-io:commons-io
    implementation "org.apache.poi:poi:6.0.0"
    implementation "org.apache.poi:poi-ooxml:6.0.0"
    implementation "org.aspectj:aspectjweaver:1.9.27"
    implementation "org.json:json:20260814"
    implementation "org.slf4j:slf4j-api:2.0.20"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.cloud:spring-cloud-openfeign-core"
    implementation "tools.jackson.core:jackson-databind"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation "org.mockito:mockito-core:5.24.0"
    testImplementation "org.mockito:mockito-inline:5.2.0"
    testImplementation "org.junit-pioneer:junit-pioneer:2.3.0"
    testImplementation "org.junit.jupiter:junit-jupiter-api:${junitJupiterVersion}"
    testImplementation  "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
    testRuntimeOnly  "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
    testRuntimeOnly  "org.junit.platform:junit-platform-commons:${junitJupiterVersion}"
    testRuntimeOnly  "org.junit.platform:junit-platform-engine:${junitJupiterVersion}"

}
// end::dependencies[]

task elasticCurlCommands() {
    group = "Help"
    description = "Displays the curl commands required to delete BEFTA case type indexes from ElasticSearch"
    doFirst() {
        getCaseTypes().forEach{
            println "curl -X DELETE http://localhost:9200/${it.toLowerCase()}_cases-000001"
        }
    }
}

def getCaseTypes() {
    def caseTypes = []
    new File("${projectDir}/src/main/resources/uk/gov/hmcts/befta/dse/ccd/definitions/valid/").eachDir {
        new File(it.path).eachDir {
            if (it.name != 'common') caseTypes << it.name
        }
    }
    // TODO: Hardcode case types which are only available in spreadsheets and add to the list?
    return caseTypes
}

compileJava {
    options.incremental = false
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
